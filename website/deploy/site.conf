server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  access_log off;
  gzip on;
  gzip_types text/css application/javascript text/javascript model/gltf+json application/json image/svg+xml font/ttf;

  # never serve the deploy kit or dotfiles
  location ~ ^/(deploy|README\.md)|/\. { return 404; }
  location ~ ^/(impressum|datenschutz)$ { try_files /$1.html =404; }

  location ~* \.(js|css)$ { add_header Cache-Control "public, max-age=3600"; }
  location ~* \.mjs$ { types { } default_type application/javascript; add_header Cache-Control "public, max-age=3600"; }
  location ~* \.webmanifest$ { types { } default_type application/manifest+json; }
  location ~* \.glb$ { types { } default_type model/gltf-binary; add_header Cache-Control "public, max-age=604800"; }
  location ~* \.(gltf|bin|jpg|png|webp|ttf|mp4|webm)$ { add_header Cache-Control "public, max-age=604800"; }
  location / { try_files $uri $uri/ =404; }
}
