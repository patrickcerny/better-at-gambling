server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  access_log off;
  absolute_redirect off;
  gzip on;
  gzip_types text/css application/javascript text/javascript model/gltf+json application/json image/svg+xml font/ttf;

  # Security headers (OWASP A05). Locations below use `expires` (not add_header) for caching, so
  # they inherit these. No full CSP yet: the page uses an inline importmap and JSON-LD.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;

  # never serve the deploy kit or dotfiles
  location ~ ^/(deploy|README\.md)|/\. { return 404; }
  location ~ ^/(impressum|datenschutz)$ { try_files /$1.html =404; }
  location = /privacy { return 301 /datenschutz?lang=en; }
  location = /imprint { return 301 /impressum?lang=en; }

  location ~* \.(js|css)$ { expires 1h; }
  location ~* \.mjs$ { types { } default_type application/javascript; expires 1h; }
  location ~* \.webmanifest$ { types { } default_type application/manifest+json; }
  location ~* \.glb$ { types { } default_type model/gltf-binary; expires 7d; }
  location ~* \.(gltf|bin|jpg|png|webp|ttf|mp4|webm)$ { expires 7d; }
  location / { try_files $uri $uri/ =404; }
}
