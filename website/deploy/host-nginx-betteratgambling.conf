# Host nginx site for betteratgambling.com (copy to /etc/nginx/sites-available/, link into
# sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx &&
# sudo certbot --nginx -d betteratgambling.com -d www.betteratgambling.com)
server {
  listen 80;
  listen [::]:80;
  server_name betteratgambling.com www.betteratgambling.com;
  location / {
    proxy_pass http://127.0.0.1:8152;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
