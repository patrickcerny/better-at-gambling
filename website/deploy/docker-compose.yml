# Serves the website on 127.0.0.1:8150; the host nginx proxies betteratgambling.com to it
# (see host-nginx-betteratgambling.conf). Start: docker compose up -d
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8150:80"
    volumes:
      - ..:/usr/share/nginx/html:ro
      - ./site.conf:/etc/nginx/conf.d/default.conf:ro
