# Builds the Windows and Linux clients on every push to main. Each game version (BUILD_ID in
# core/net/protocol.gd, bumped once per stage) gets its own release v<version>; later pushes with the
# same version refresh that release's downloads instead of adding a new one.
# Shareable links that always point at the newest build:
#   https://github.com/patrickcerny/better-at-gambling/releases/latest
#   https://github.com/patrickcerny/better-at-gambling/releases/latest/download/BetterAtGambling-windows.zip
# The VPS deploys the same commit on its own (deploy/install.sh cron, waits for empty rooms).
name: Build & release

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "deploy/**", "services/orchestrator/**"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # changelog since the previous version tag

      - name: Cache Godot + export templates
        uses: actions/cache@v4
        with:
          path: |
            tools/godot
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-stable-v1

      - name: Toolchain
        run: tools/setup_toolchain.sh

      - name: Import project
        run: tools/godot/godot --headless --path . --import > import.log 2>&1 || (tail -50 import.log; exit 1)

      - name: Unit tests + boot smoke
        run: scripts/test.sh unit && scripts/test.sh smoke

      - name: Export
        run: |
          mkdir -p build/windows build/linux dist
          tools/godot/godot --headless --path . --export-release "Windows" "$PWD/build/windows/BetterAtGambling.exe"
          tools/godot/godot --headless --path . --export-release "Linux" "$PWD/build/linux/BetterAtGambling.x86_64"
          test -s build/windows/BetterAtGambling.exe && test -s build/linux/BetterAtGambling.x86_64
          build/linux/BetterAtGambling.x86_64 --headless -- --smoke-test --frames 60
          (cd build/windows && zip -q -9 ../../dist/BetterAtGambling-windows.zip BetterAtGambling.exe)
          (cd build/linux && zip -q -9 ../../dist/BetterAtGambling-linux.zip BetterAtGambling.x86_64)
          ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_id=$(sed -n 's/^const BUILD_ID: String = "\(.*\)"/\1/p' core/net/protocol.gd)
          tag="v${build_id}"
          prev=$(git tag -l 'v*' --sort=-creatordate | grep -vx "$tag" | head -1)
          {
            echo "Game version **${build_id}**, commit ${GITHUB_SHA::7}."
            echo
            echo '**Windows:** download `BetterAtGambling-windows.zip`, unzip, run `BetterAtGambling.exe`'
            echo '(SmartScreen: "More info" → "Run anyway"). Then Play Online → Create Party and share the code.'
            echo 'Online parties run on the game server automatically, no setup needed. Older versions cannot join.'
            echo
            echo "### Changes${prev:+ since $prev}"
            git log --no-merges --format='- %s' ${prev:+$prev..}HEAD | head -60
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            # Same version, newer commit: refresh the downloads and notes, keep it the latest release.
            gh release upload "$tag" dist/*.zip --clobber
            gh release edit "$tag" --notes-file notes.md --latest
          else
            gh release create "$tag" dist/*.zip --target "$GITHUB_SHA" \
              --title "Better at Gambling ${build_id}" --notes-file notes.md --latest
          fi
